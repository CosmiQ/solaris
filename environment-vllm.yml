name: solaris-vllm
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  # Python 3.8+ required for vLLM
  - python>=3.8
  - pip>=21.0

  # Core geospatial dependencies
  - affine>=2.3.0
  - fiona>=1.8.0
  - gdal>=3.4.0
  - geopandas>=0.10.0
  - pyproj>=3.0.0
  - rasterio>=1.2.0
  - shapely>=1.8.0

  # Scientific computing
  - matplotlib>=3.5.0
  - networkx>=2.6
  - numpy>=1.20.0
  - opencv>=4.5.0
  - pandas>=1.3.0
  - scikit-image>=0.18.0
  - scipy>=1.7.0
  - rtree>=0.9.3

  # Deep learning (PyTorch 2.0+ for vLLM)
  - pytorch>=2.0.0
  - torchvision>=0.15.0
  - pytorch-cuda=11.8  # or 12.1 depending on your system
  - cudatoolkit>=11.8

  # Utilities
  - pyyaml>=5.4
  - requests>=2.25.0
  - tqdm>=4.60.0
  - urllib3>=1.26.0

  # Install via pip
  - pip:
    # Image augmentation
    - albumentations>=1.0.0
    # vLLM and dependencies
    - vllm>=0.3.0
    - Pillow>=9.0.0
    # Optional: for some vision-language models
    - transformers>=4.36.0
    - accelerate>=0.20.0
